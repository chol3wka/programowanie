<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #napis{
      position: absolute;
      background-color: white;
      width: 350px;
      float: left;
      font-size: 18pt;
      font-family: Arial, sans-serif;
    }
  </style>
  <script>
    function animacja(){
      let blok = document.getElementById('napis');
      if (parseInt(blok.style.left)<50)
      {
        blok.style.left = "1000px";
      }
      else
      {
        blok.style.left = (parseInt(blok.style.left)- 1) + "px";
      }
    }
    window.setInterval(animacja, 50);
  </script>
</head>
<body>
<div id="napis" style="left: 500px;">
  Javascript - język skryptowy
</div>
</body>
</html>
