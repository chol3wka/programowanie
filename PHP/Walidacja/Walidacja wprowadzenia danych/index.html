<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sprawdz(form) {
            if (form.nazw.value=== '' ) {
        alert('Pole Nazwisko musi być wypełnione');
        form.nazw.focus () ;
        return false;
        }
        if (form.imie.value=== '') {
            alert('Pole Imię musi być wypełnione');
            form.imie.focus();
            return false;
        }
        if (form.zawod.value=== '') {
        alert('Pole Zawód musi być wypełnione');
        form.zawod.focus();
        return false;
        }
        return true;
        }
        </script>
        <style>
        div {
            width: 400px;
            background-color: #dfdfdf;
            padding: 10px;
        }
        .pole {
        position:absolute;
        left:90px;
    }
#akl
{
font-size: 14pt;
}
</style>        
</head>
<body>
    <div>
        <form enctype="text/plain" action="" method="post" onsubmit="return sprawdz(this);">
        <p id="akl">Dane osobowe:</p>
        <b>Nazwisko:</b>
            <label>
                <input class="pole" name="nazw" value="" size="40">
            </label><br>
        <b>Imię:</b>
            <label>
                <input class="pole" name="imie" value="" size="40">
            </label><br>
        <b>Zawód:</b>
            <label>
                <input class="pole" name="zawod" value="" size="40">
            </label><br><br>
        <label> Pracuję: <input type="checkbox" name="opcje" maxlength="l">
        </label><br><br>
        <input type="submit" value="Wyślij"></form>
        </div>
</body>
</html>
